name: Discover Stations

# Automatically updates stations.json once every week.
# You can also run it manually from:
# Actions -> "Discover Stations" -> "Run workflow"

on:
  workflow_dispatch: {}

  schedule:
    # Every Sunday at 2:00 AM Nepal time
    # Nepal = UTC +5:45
    # Therefore: Saturday 20:15 UTC
    - cron: "15 20 * * 6"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run discovery sweep
        run: |
          python discover_stations.py

      - name: Commit stations.json to the repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update stations.json from weekly discovery"
          file_pattern: stations.json