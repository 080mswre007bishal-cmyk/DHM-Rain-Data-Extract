name: DHM Rainfall Scrape

# Runs main.py automatically twice a day, on GitHub's servers, for free.
# Visits each station's own page (dhm.gov.np/hydrology/rainfallSingle/<id>,
# via stations.json), sets Period to Daily, clicks VIEW, reads the
# Date/Daily/Total table, and appends only new dates to
# output/<station>.xlsx. Google Drive upload is currently disabled --
# see the note near the bottom of main.py's main() function for how to
# turn it back on. In the meantime, every run's output/*.xlsx files are
# attached to that run as a downloadable artifact (see the last step
# below).

on:
  schedule:
    # Times are UTC. Nepal is UTC+5:45.
    # 03:15 UTC = 09:00 NPT, 15:15 UTC = 21:00 NPT.
    # Adjust to whenever DHM's daily reading is actually published if needed.
    - cron: "15 3,15 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python main.py

      - name: Upload output (Excel files + debug, if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rainfall-output-${{ github.run_id }}
          path: output/
          retention-days: 30
