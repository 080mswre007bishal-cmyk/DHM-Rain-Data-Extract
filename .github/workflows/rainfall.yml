name: DHM Rainfall Scrape

on:
  workflow_dispatch: {}

  schedule:
    # Every Friday at 1:00 AM Nepal time = Thursday 19:15 UTC
    - cron: "15 19 * * 4"

jobs:
  rainfall:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Restore Google credentials
        shell: bash
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json

      - name: Run rainfall scraper
        env:
          DEBUG_STATIONS: "0"
        run: |
          python main.py
