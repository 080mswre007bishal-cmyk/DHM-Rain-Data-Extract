name: DHM Rainfall Scrape

on:
  schedule:
    # Times are UTC. Nepal is UTC+5:45.
    # 04:15 UTC = 10:00 AM NPT
    # 15:45 UTC = 09:30 PM NPT
    # 18:15 UTC = 12:00 AM midnight NPT (next day)
    - cron: "15 4 * * *"
    - cron: "45 15 * * *"
    - cron: "15 18 * * *"

  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python main.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rainfall-output-${{ github.run_id }}
          path: output/
          retention-days: 7