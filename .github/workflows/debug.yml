name: Debug Rainfall Extraction

on:
  workflow_dispatch:
    inputs:
      station_count:
        description: "How many stations to test"
        required: true
        default: "3"
        type: string

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run debug scrape + Google Drive upload
        env:
          DEBUG_STATIONS: ${{ inputs.station_count }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python main.py

      - name: Upload debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output-${{ github.run_id }}
          path: output/
          retention-days: 7