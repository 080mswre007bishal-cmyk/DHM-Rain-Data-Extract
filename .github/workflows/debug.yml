```yaml
name: Debug Rainfall Extraction

# Run this manually from the Actions tab.
# It tests a selected number of stations, creates the normal Excel files,
# and also uploads/updates those Excel files in Google Drive.
#
# It also saves screenshots + page text as downloadable GitHub artifacts.

on:
  workflow_dispatch:
    inputs:
      station_count:
        description: "How many stations to test"
        default: "3"
        required: true

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run debug scrape + Google Drive upload
        env:
          DEBUG_STATIONS: ${{ github.event.inputs.station_count }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python main.py

      - name: Upload debug screenshots + text + Excel files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output-${{ github.run_id }}
          path: output/
          retention-days: 7
```
